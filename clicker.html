<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 Супер Кликер Deluxe</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  :root{
    --gold:#ffc83d;--bg1:#0a0d1a;--panel:rgba(28,34,60,.68);
    --border:rgba(120,150,255,.18);--accent:#6c8cff;
    --green:#3ddc84;--purple:#c084fc;--cyan:#22d3ee;--red:#ff5a5a;
  }
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 15% 10%,#1d2444 0%,var(--bg1) 55%),var(--bg1);
    color:#e8ecff;padding:14px;min-height:100vh;overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 80% 20%,rgba(108,140,255,.12),transparent 45%),
      radial-gradient(circle at 10% 90%,rgba(255,200,61,.08),transparent 40%),
      radial-gradient(circle at 50% 50%,rgba(192,132,252,.05),transparent 60%);
  }
  .app{position:relative;z-index:1;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr 440px;gap:14px}
  @media(max-width:960px){.app{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:20px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}

  /* ЛЕВАЯ ПАНЕЛЬ */
  .main-panel{padding:18px;display:flex;flex-direction:column;gap:14px;position:relative}
  .title{font-size:24px;font-weight:900;letter-spacing:.5px;text-align:center;
    background:linear-gradient(90deg,#ffd85a,#ff9f43,#c084fc,#ffd85a);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 4s linear infinite}
  @keyframes shine{to{background-position:200% center}}

  .stats-row{display:flex;gap:8px;width:100%;flex-wrap:wrap}
  .stat{flex:1;min-width:90px;background:rgba(255,255,255,.04);border:1px solid var(--border);
    border-radius:12px;padding:8px 10px;text-align:center}
  .stat .label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8b95c9;margin-bottom:2px}
  .stat .value{display:block;font-size:18px;font-weight:800;color:var(--gold)}
  .stat.cps .value{color:var(--green)}
  .stat.cpc .value{color:#7fb2ff}

  .buffs-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:0}
  .buff{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;
    font-size:12px;font-weight:800;background:linear-gradient(135deg,rgba(255,200,61,.25),rgba(255,140,0,.15));
    border:1px solid rgba(255,200,61,.5);animation:buffPulse 1.5s ease-in-out infinite}
  .buff.click{background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(6,182,212,.15));border-color:rgba(34,211,238,.5)}
  @keyframes buffPulse{50%{box-shadow:0 0 16px rgba(255,200,61,.4)}}

  .click-zone{position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center;
    min-height:280px;border-radius:18px;user-select:none}
  .coin{width:min(220px,55vw);height:min(220px,55vw);border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 32% 28%,#fff3b0 0%,#ffd23d 30%,#ff9d00 62%,#a75f00 100%);
    box-shadow:0 0 70px rgba(255,180,0,.35),0 0 140px rgba(255,140,0,.18),
      inset 0 -12px 34px rgba(120,60,0,.55),inset 0 12px 34px rgba(255,255,210,.7);
    font-size:min(90px,24vw);display:flex;align-items:center;justify-content:center;
    transition:transform .07s ease,box-shadow .2s;animation:pulse 2.6s ease-in-out infinite;
    position:relative;z-index:2}
  .coin:hover{box-shadow:0 0 90px rgba(255,190,0,.55),0 0 180px rgba(255,140,0,.25),
    inset 0 -12px 34px rgba(120,60,0,.55),inset 0 12px 34px rgba(255,255,210,.7)}
  .coin:active{transform:scale(.93)}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}

  .streak-indicator{position:absolute;top:8px;right:8px;padding:6px 12px;border-radius:10px;
    background:linear-gradient(135deg,#ff6b35,#ff3860);font-weight:900;font-size:14px;color:#fff;
    box-shadow:0 0 20px rgba(255,80,80,.6);opacity:0;transition:opacity .2s;pointer-events:none}
  .streak-indicator.active{opacity:1;animation:streakPulse .6s ease-in-out infinite}
  @keyframes streakPulse{50%{transform:scale(1.08)}}

  .float-text{position:absolute;pointer-events:none;font-weight:900;font-size:22px;color:#ffe066;
    text-shadow:0 0 14px rgba(255,200,0,.9),0 2px 4px rgba(0,0,0,.6);
    transform:translate(-50%,-50%);z-index:5;white-space:nowrap}
  .particle{position:absolute;width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle,#fff6c0,#ffb300);pointer-events:none;z-index:4;
    transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(255,200,0,.9)}

  .prestige-box{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(90deg,rgba(255,200,61,.10),rgba(192,132,252,.10));
    border:1px solid rgba(255,200,61,.25);border-radius:14px;padding:11px 14px;flex-wrap:wrap}
  .prestige-info{font-size:13px;color:#c9d2ff;line-height:1.55;flex:1;min-width:180px}
  .prestige-info b{color:var(--gold)}
  .prestige-info .soul-val{color:var(--purple)}
  .prestige-info .ess-val{color:var(--cyan)}
  .prestige-btns{display:flex;flex-direction:column;gap:5px}

  button{font-family:inherit}
  .btn{border:none;border-radius:12px;padding:10px 18px;font-weight:800;font-size:13.5px;cursor:pointer;
    background:linear-gradient(135deg,#ffd54a,#ff9d00);color:#3a2400;
    box-shadow:0 6px 18px rgba(255,160,0,.35);transition:.12s;white-space:nowrap}
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,160,0,.5)}
  .btn:active:not(:disabled){transform:translateY(0) scale(.97)}
  .btn:disabled{background:rgba(255,255,255,.07);color:#6b74a0;cursor:not-allowed;box-shadow:none}
  .btn.star{background:linear-gradient(135deg,#a78bfa,#6c8cff);color:#fff;box-shadow:0 6px 18px rgba(108,140,255,.4)}
  .btn.rebirth{background:linear-gradient(135deg,#c084fc,#7c3aed);color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.45)}
  .btn.ascend{background:linear-gradient(135deg,#22d3ee,#0891b2);color:#fff;box-shadow:0 6px 18px rgba(34,211,238,.4)}
  .btn.small{padding:6px 11px;font-size:11.5px;border-radius:8px}
  .btn.danger{background:linear-gradient(135deg,#ff7b7b,#d63030);color:#fff;box-shadow:0 6px 18px rgba(214,48,48,.35)}

  /* ПРАВАЯ ПАНЕЛЬ */
  .shop-panel{padding:14px;display:flex;flex-direction:column;gap:10px;
    max-height:calc(100vh - 28px);min-height:520px}
  .tabs{display:flex;gap:4px;background:rgba(0,0,0,.25);padding:4px;border-radius:12px;flex-wrap:wrap}
  .tab{flex:1;min-width:0;border:none;background:transparent;color:#8b95c9;
    padding:7px 3px;border-radius:9px;cursor:pointer;font-weight:700;font-size:11px;
    transition:.18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab:hover{color:#c9d2ff}
  .tab.active{background:linear-gradient(135deg,rgba(108,140,255,.35),rgba(167,139,250,.35));
    color:#fff;box-shadow:0 4px 14px rgba(108,140,255,.25)}

  .tab-content{flex:1;overflow-y:auto;padding-right:4px}
  .tab-content::-webkit-scrollbar{width:8px}
  .tab-content::-webkit-scrollbar-track{background:rgba(255,255,255,.03);border-radius:8px}
  .tab-content::-webkit-scrollbar-thumb{background:rgba(120,150,255,.35);border-radius:8px}
  .tab-content::-webkit-scrollbar-thumb:hover{background:rgba(120,150,255,.6)}

  .buy-row{display:flex;gap:5px;margin-bottom:8px}
  .buy-amt{flex:1;padding:7px;border-radius:9px;cursor:pointer;
    border:1px solid var(--border);background:rgba(255,255,255,.04);
    color:#9aa4d6;font-weight:800;font-size:11.5px;transition:.15s}
  .buy-amt:hover{background:rgba(255,255,255,.08);color:#fff}
  .buy-amt.active{background:linear-gradient(135deg,rgba(108,140,255,.5),rgba(167,139,250,.5));
    color:#fff;border-color:transparent}

  .shop-item{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 12px;margin-bottom:7px;border-radius:12px;background:rgba(255,255,255,.04);
    border:1px solid var(--border);cursor:pointer;transition:.15s}
  .shop-item:hover{background:rgba(108,140,255,.12);border-color:rgba(108,140,255,.45);transform:translateX(2px)}
  .shop-item.disabled{opacity:.42;cursor:not-allowed}
  .shop-item.disabled:hover{transform:none;background:rgba(255,255,255,.04);border-color:var(--border)}
  .si-left{min-width:0;flex:1}
  .si-name{font-weight:800;font-size:13.5px;margin-bottom:1px}
  .si-desc{font-size:11px;color:#8b95c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .si-right{text-align:right;flex-shrink:0}
  .si-owned{font-size:15px;font-weight:900;color:var(--accent);line-height:1}
  .si-cost{font-size:11.5px;font-weight:700;color:var(--gold);margin-top:2px;white-space:nowrap}

  .upgrade-item{display:flex;align-items:center;gap:10px;padding:11px;margin-bottom:7px;border-radius:12px;
    background:linear-gradient(135deg,rgba(108,140,255,.12),rgba(167,139,250,.08));
    border:1px solid rgba(108,140,255,.25);cursor:pointer;transition:.15s}
  .upgrade-item:hover{background:linear-gradient(135deg,rgba(108,140,255,.24),rgba(167,139,250,.16));
    border-color:rgba(108,140,255,.6)}
  .upgrade-item.disabled{opacity:.45;cursor:not-allowed}
  .upgrade-icon{font-size:22px;flex-shrink:0;width:28px;text-align:center}
  .upgrade-body{flex:1;min-width:0}
  .upgrade-name{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .upgrade-desc{font-size:11px;color:#9aa4d6;margin-top:1px;line-height:1.3}
  .upgrade-cost{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap;flex-shrink:0}

  .ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .ach{padding:9px;border-radius:11px;text-align:center;background:rgba(255,255,255,.03);
    border:1px solid var(--border);transition:.15s}
  .ach.unlocked{background:linear-gradient(135deg,rgba(255,200,61,.16),rgba(255,140,0,.08));
    border-color:rgba(255,200,61,.5);box-shadow:0 0 18px rgba(255,200,61,.16)}
  .ach-icon{font-size:22px;margin-bottom:3px;filter:grayscale(1);opacity:.35}
  .ach.unlocked .ach-icon{filter:none;opacity:1}
  .ach-name{font-size:11px;font-weight:800;margin-bottom:1px}
  .ach-desc{font-size:9.5px;color:#8b95c9;line-height:1.2}

  .section-title{font-size:12px;font-weight:800;color:#8b95c9;text-transform:uppercase;
    letter-spacing:1px;margin:12px 0 8px;padding-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,.08)}
  .section-title:first-child{margin-top:0}

  .prestige-card{background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(108,140,255,.08));
    border:1px solid rgba(167,139,250,.28);border-radius:14px;padding:14px;margin-bottom:10px}
  .prestige-card.rebirth{background:linear-gradient(135deg,rgba(192,132,252,.12),rgba(124,58,237,.08));
    border-color:rgba(192,132,252,.32)}
  .prestige-card.ascend{background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(6,182,212,.08));
    border-color:rgba(34,211,238,.32)}
  .pc-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .pc-icon{font-size:28px}
  .pc-title{font-size:15px;font-weight:900}
  .pc-desc{font-size:11.5px;color:#a5aee0;line-height:1.5;margin-bottom:10px}
  .pc-desc b{color:#e0e6ff}
  .pc-stats{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .pc-stat{flex:1;min-width:70px;text-align:center;padding:7px 4px;border-radius:9px;
    background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06)}
  .pc-stat-label{display:block;font-size:9px;text-transform:uppercase;color:#8b95c9;margin-bottom:2px}
  .pc-stat-val{display:block;font-size:15px;font-weight:900}
  .pc-btn{width:100%;padding:11px;font-size:13px;font-weight:900;border:none;border-radius:11px;
    cursor:pointer;transition:.15s;margin-bottom:6px}
  .pc-btn:disabled{background:rgba(255,255,255,.07);color:#6b74a0;cursor:not-allowed}
  .pc-btn.star{background:linear-gradient(135deg,#a78bfa,#6c8cff);color:#fff;box-shadow:0 6px 18px rgba(108,140,255,.4)}
  .pc-btn.star:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px rgba(108,140,255,.6)}
  .pc-btn.rebirth{background:linear-gradient(135deg,#c084fc,#7c3aed);color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.45)}
  .pc-btn.rebirth:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px rgba(124,58,237,.65)}
  .pc-btn.ascend{background:linear-gradient(135deg,#22d3ee,#0891b2);color:#fff;box-shadow:0 6px 18px rgba(34,211,238,.4)}
  .pc-btn.ascend:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px rgba(34,211,238,.6)}
  .pc-warn{font-size:10.5px;color:#8b95c9;line-height:1.5;text-align:center;padding-top:4px}
  .pc-warn b{color:#ffc83d}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
  .stats-item{padding:9px;border-radius:11px;background:rgba(255,255,255,.04);
    border:1px solid var(--border)}
  .stats-label{display:block;font-size:10px;text-transform:uppercase;color:#8b95c9;margin-bottom:3px;letter-spacing:.5px}
  .stats-value{display:block;font-size:14px;font-weight:800;color:#e0e6ff}

  .setting-row{display:flex;align-items:center;justify-content:space-between;
    padding:11px 12px;border-radius:11px;background:rgba(255,255,255,.04);
    border:1px solid var(--border);margin-bottom:7px}
  .setting-label{font-size:13px;font-weight:700}
  .toggle{position:relative;width:44px;height:24px;background:rgba(255,255,255,.1);
    border-radius:12px;cursor:pointer;transition:.2s;flex-shrink:0}
  .toggle.on{background:linear-gradient(135deg,#6c8cff,#a78bfa)}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
    background:#fff;border-radius:50%;transition:.2s}
  .toggle.on::after{left:23px}

  .ach-counter{text-align:center;font-size:11.5px;color:#8b95c9;margin-bottom:9px}
  .ach-counter b{color:var(--gold)}

  .footer-note{font-size:11px;color:#5f6894;text-align:center;padding-top:6px;
    border-top:1px solid rgba(255,255,255,.06)}

  /* ЗОЛОТАЯ ПЕЧЕНЬКА */
  .golden-cookie{position:fixed;width:70px;height:70px;border-radius:50%;z-index:900;
    cursor:pointer;border:none;font-size:38px;
    background:radial-gradient(circle at 35% 30%,#fff5b8 0%,#ffcb42 40%,#c47a00 100%);
    box-shadow:0 0 40px rgba(255,200,61,.9),0 0 80px rgba(255,140,0,.5),
      inset 0 -6px 18px rgba(120,60,0,.5),inset 0 6px 18px rgba(255,255,220,.6);
    animation:cookieBounce 1.2s ease-in-out infinite;display:flex;align-items:center;justify-content:center}
  @keyframes cookieBounce{0%,100%{transform:scale(1) rotate(-5deg)}50%{transform:scale(1.12) rotate(5deg)}}

  /* ТОСТЫ */
  .toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:7px;z-index:9999;pointer-events:none;align-items:center}
  .toast{background:linear-gradient(135deg,rgba(255,200,61,.95),rgba(255,150,0,.95));
    color:#2b1a00;font-weight:800;font-size:13px;padding:10px 18px;border-radius:13px;
    box-shadow:0 10px 30px rgba(255,150,0,.45);animation:toastIn .35s cubic-bezier(.2,1.4,.5,1);
    white-space:nowrap;max-width:90vw;text-align:center}
  .toast.blue{background:linear-gradient(135deg,rgba(108,140,255,.95),rgba(88,101,242,.95));color:#fff}
  .toast.purple{background:linear-gradient(135deg,rgba(192,132,252,.95),rgba(124,58,237,.95));color:#fff}
  .toast.cyan{background:linear-gradient(135deg,rgba(34,211,238,.95),rgba(6,182,212,.95));color:#fff}
  .toast.red{background:linear-gradient(135deg,rgba(255,120,120,.95),rgba(220,50,50,.95));color:#fff}
  @keyframes toastIn{from{opacity:0;transform:translateY(-18px) scale(.9)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="toast-wrap" id="toastWrap"></div>

<div class="app">
  <!-- ЛЕВАЯ ПАНЕЛЬ -->
  <main class="panel main-panel">
    <div class="title">💰 СУПЕР КЛИКЕР DELUXE 💰</div>

    <div class="stats-row">
      <div class="stat"><span class="label">Монеты</span><span class="value" id="statCoins">0</span></div>
      <div class="stat cps"><span class="label">В секунду</span><span class="value" id="statCps">0</span></div>
      <div class="stat cpc"><span class="label">За клик</span><span class="value" id="statCpc">1</span></div>
    </div>

    <div class="buffs-row" id="buffsRow"></div>

    <div class="click-zone" id="clickZone">
      <div class="streak-indicator" id="streakInd">🔥 x0</div>
      <button class="coin" id="coin">💎</button>
    </div>

    <div class="prestige-box">
      <div class="prestige-info">
        ⭐ <b id="statStars">0</b> · 👻 <b class="soul-val" id="statSouls">0</b> · 🌟 <b class="ess-val" id="statEssence">0</b><br>
        Множитель: <b id="statMult">×1</b> · 🍪 <b id="statGolden">0</b><br>
        <span style="font-size:11.5px;color:#8b95c9">Всего: <b id="statLifetime">0</b></span>
      </div>
      <div class="prestige-btns">
        <button class="btn star small" id="prestigeBtn">⭐ Престиж</button>
        <button class="btn rebirth small" id="rebirthBtn">👻 Перерождение</button>
        <button class="btn ascend small" id="ascendBtn">🌟 Вознесение</button>
      </div>
    </div>
  </main>

  <!-- ПРАВАЯ ПАНЕЛЬ -->
  <aside class="panel shop-panel">
    <div class="tabs">
      <button class="tab active" data-tab="buildings">🏗️ Здания</button>
      <button class="tab" data-tab="upgrades">⚡ Улучшения</button>
      <button class="tab" data-tab="prestige">⭐ Престиж</button>
      <button class="tab" data-tab="achievements">🏆 Достижения</button>
      <button class="tab" data-tab="more">📊 Ещё</button>
    </div>
    <div class="tab-content" id="tabContent"></div>
    <div class="footer-note" id="footerNote">Автосохранение активно</div>
  </aside>
</div>

<script>
/* ============================================================
   ДАННЫЕ
   ============================================================ */
const SAVE_KEY = 'superClicker_deluxe_v2';

const BUILDINGS = [
  {id:'cursor',   name:'👆 Курсор',           base:15,        cps:0.1},
  {id:'helper',   name:'🧑‍💼 Помощник',       base:120,       cps:1},
  {id:'farm',     name:'🌾 Ферма',            base:1400,      cps:8},
  {id:'factory',  name:'🏭 Завод',            base:18000,     cps:47},
  {id:'bank',     name:'🏦 Банк',             base:250000,    cps:260},
  {id:'temple',   name:'⛩️ Храм',             base:3000000,   cps:1400},
  {id:'tower',    name:'🏙️ Небоскрёб',        base:40000000,  cps:7800},
  {id:'lab',      name:'🧪 Лаборатория',      base:500000000, cps:44000},
  {id:'portal',   name:'🌀 Портал',           base:8e9,       cps:260000},
  {id:'time',     name:'⏳ Машина времени',    base:1.2e11,    cps:1.6e6},
  {id:'galaxy',   name:'🌌 Галактика',        base:1.8e12,    cps:1e7},
  {id:'universe', name:'🌠 Вселенная',        base:3e13,      cps:6.5e7},
];

// Click upgrades (repeatable)
const CLICK_UPGRADES = [

const SUFFIX = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qd','Sd','St','Oc','Nn'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return (Math.round(n*10)/10).toString();
  let tier = Math.floor(Math.log10(n)/3);
  if (tier >= SUFFIX.length) tier = SUFFIX.length-1;
  const s = n / Math.pow(1000,tier);
  return (s >= 100 ? s.toFixed(0) : s.toFixed(2)) + SUFFIX[tier];
}
function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h>0) return `${h}ч ${m}м`;
  if (m>0) return `${m}м ${s}с`;
  return `${s}с`;
}

/* ============================================================
   МАТЕМАТИКА
   ============================================================ */
function getAchievementCount(){ return Object.keys(state.achievements).length; }

function getBaseCPS(){
  let sum = 0;
  for (let i=0;i<BUILDINGS.length;i++){
    let mult = 1;
    // building upgrades (×2 each)
    for (let j=0;j<4;j++){
      if (state.buildingUpgrades[`bu_${i}_${j}`]) mult *= 2;
    }
    sum += BUILDINGS[i].cps * state.owned[i] * mult;
  }
  return sum;
}
function getCPSBuffMult(){
  let m = 1;
  for (const b of state.buffs) if (b.type === 'cps') m *= b.mult;
  return m;
}
function getClickBuffMult(){
  let m = 1;
  for (const b of state.buffs) if (b.type === 'click') m *= b.mult;
  return m;
}
function getGlobalMult(){
  const prestige = 1 + state.stars * 0.25 + state.souls * 2;
  const essence = Math.pow(1.5, state.essence);
  const ach = 1 + getAchievementCount() * 0.02;
  return prestige * essence * ach;
}
function getCPS(){
  return getBaseCPS() * getCPSBuffMult() * getGlobalMult();
}
function getBaseClickRaw(){
  let sum = 1;
  for (const u of CLICK_UPGRADES){
    sum += u.val * (state.clickLevels[u.id] || 0);
  }
  sum += getBaseCPS() * 0.01;
  return sum;
}
function getStreakBonus(){
  return 1 + Math.min(state.streak, 100) * 0.02; // +2% per click, max +200%
}
function getClickPower(){
  return getBaseClickRaw() * getClickBuffMult() * getStreakBonus() * getGlobalMult();
}
function clickUpgradeCost(u){
  const lvl = state.clickLevels[u.id] || 0;
  return Math.ceil(u.baseCost * Math.pow(u.growth, lvl));
}
function clickUpgradeUnlocked(u){
  if (u.reqPrev && (state.clickLevels[u.reqPrev] || 0) < u.reqLevel) return false;
  return true;
}
function costOf(base, owned, n){
  return base * Math.pow(1.15, owned) * (Math.pow(1.15, n) - 1) / 0.15;
}
function maxAffordable(base, owned, coins){
  const unit = base * Math.pow(1.15, owned);
  const v = coins * 0.15 / unit + 1;
  if (v <= 1) return 0;
  return Math.max(0, Math.floor(Math.log(v) / Math.log(1.15)));
}
function getPrestigeGain(){
  if (state.totalCoins < 1e6) return 0;
  return Math.floor(Math.sqrt(state.totalCoins / 1e6));
}
function getRebirthGain(){
  if (state.stars < 10) return 0;
  return Math.floor(state.stars / 5);
}
function getAscensionGain(){
  if (state.souls < 10) return 0;
  return Math.floor(state.souls / 10);
}

let audioCtx = null;
function initAudio(){
  if (!state.settings.sound) return;
  if (!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur=0.08, type='sine', vol=0.05){
  if (!state.settings.sound || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur);
}

function spawnFloat(x,y,text){
  if (!state.settings.particles) return;
  const s = document.createElement('div');
  s.className='float-text'; s.textContent=text;
  s.style.left=x+'px'; s.style.top=y+'px';
  el.clickZone.appendChild(s);
  s.animate([
    {transform:'translate(-50%,-50%) scale(.7)',opacity:1},
    {transform:'translate(-50%,-160%) scale(1.15)',opacity:0}
  ],{duration:950,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>s.remove();
}
function spawnParticles(x,y){
  if (!state.settings.particles) return;
  for (let i=0;i<6;i++){
    const p = document.createElement('div');
    p.className='particle';
    p.style.left=x+'px'; p.style.top=y+'px';
    el.clickZone.appendChild(p);
    const ang=(Math.PI*2/6)*i+Math.random()*0.6;
    const dist=55+Math.random()*70, size=5+Math.random()*7;
    p.style.width=p.style.height=size+'px';
    p.animate([
      {transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist}px)) scale(0)`,opacity:0}
    ],{duration:550+Math.random()*250,easing:'cubic-bezier(.15,.7,.4,1)'}).onfinish=()=>p.remove();
  }
}

function doClick(clientX,clientY, manual=true){
  initAudio();
  const now = Date.now();
  if (manual){
    if (now - state.lastClickTime < 1000) state.streak++;
    else state.streak = 1;
    state.lastClickTime = now;
    if (state.streak > state.maxStreak) state.maxStreak = state.streak;
  }
  const gain = getClickPower();
  state.coins += gain;
  state.totalCoins += gain;
  state.lifetimeCoins += gain;
  state.totalClicks++;

  const rect = el.clickZone.getBoundingClientRect();
  const x = (clientX!==undefined?clientX:rect.left+rect.width/2) - rect.left;
  const y = (clientY!==undefined?clientY:rect.top+rect.height/2) - rect.top;
  spawnFloat(x,y,'+'+fmt(gain));
  spawnParticles(x,y);
  sfx.click();

  el.coin.animate([
    {transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}
  ],{duration:130,easing:'ease-out'});

  updateStreakIndicator();
  updateUI();
  checkAchievements();
}
function updateStreakIndicator(){
  if (state.streak >= 10 && Date.now()-state.lastClickTime < 1500){
    el.streakInd.textContent = '🔥 ×' + state.streak + '  (+' + Math.min(state.streak*2,200) + '%)';
    el.streakInd.classList.add('active');
  } else {
    el.streakInd.classList.remove('active');
  }
}

el.coin.addEventListener('pointerdown', e=>{
  e.preventDefault();
  doClick(e.clientX, e.clientY);
});
el.coin.addEventListener('keydown', e=>{
  if (e.key===' '||e.key==='Enter'){ e.preventDefault(); doClick(); }
});

}
function weightedRandom(items){
  const total = items.reduce((s,i)=>s+i.weight,0);
  let r = Math.random()*total;
  for (const i of items){ r -= i.weight; if (r<=0) return i; }
  return items[0];
}
function collectGoldenCookie(){
  removeGoldenCookie();
  state.goldenCaught++;
  sfx.golden();
  const effect = weightedRandom(GOLDEN_EFFECTS);
  let msg = '';
  if (effect.id==='lucky'){
    const gain = Math.max(100, state.coins*0.15) + getCPS()*60;
    state.coins += gain; state.totalCoins += gain; state.lifetimeCoins += gain;
    msg = `🍀 +${fmt(gain)} монет!`;
  } else if (effect.id==='frenzy'){
    state.buffs.push({id:'frenzy_'+Date.now(),type:'cps',mult:7,until:Date.now()+77000,icon:'🔥',name:'Ярость ×7'});
    msg = '🔥 Ярость! Доход ×7 на 77 сек!';
  } else if (effect.id==='clickFrenzy'){
    state.buffs.push({id:'cfrenzy_'+Date.now(),type:'click',mult:777,until:Date.now()+13000,icon:'💥',name:'Клик ×777'});

  } else {
    msg = '☠️ ...ничего не произошло';
  }

  renderBuffs();
  updateUI();
  checkAchievements();
}

function cleanBuffs(){

  if (before !== state.buffs.length) renderBuffs();
}

  if (state.buffs.length === 0){ el.buffsRow.innerHTML = ''; return; }
  el.buffsRow.innerHTML = state.buffs.map(b=>{
    const rem = Math.max(0, Math.ceil((b.until-Date.now())/1000));
    return `<div class="buff ${b.type==='click'?'click':''}">${b.icon} ${b.name} · ${rem}с</div>`;
  }).join('');
}

function renderBuildings(){
  el.tabContent.innerHTML = `<div class="buy-row" id="buyRow"></div><div id="shopList"></div>`;
  const row = $('buyRow');
  const opts = [1,10,100,'max'];
  shopRefs.buyBtns = opts.map(n=>{
    const b = document.createElement('button');
    b.className='buy-amt'+(buyAmount===n?' active':'');
    b.textContent = n==='max'?'MAX':'×'+n;
    b.onclick=()=>{buyAmount=n;shopRefs.buyBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');updateShop();};
    row.appendChild(b);
    return b;
  });
  const list = $('shopList');
  shopRefs.items = BUILDINGS.map((b,i)=>{
    const div = document.createElement('div');
    div.className='shop-item';
    div.innerHTML = `
      <div class="si-left">
        <div class="si-name">${b.name}</div>
        <div class="si-desc">+${fmt(b.cps)}/сек за шт.</div>
      </div>
      <div class="si-right">
        <div class="si-owned">0</div>
        <div class="si-cost">💰 0</div>
      </div>`;
    div.onclick=()=>buyBuilding(i);
    list.appendChild(div);
    return {el:div, owned:div.querySelector('.si-owned'), cost:div.querySelector('.si-cost')};
  });
  updateShop();
}
function currentBuyCount(base, owned){
  if (buyAmount==='max') return Math.max(1,maxAffordable(base,owned,state.coins));
  return buyAmount;
}
function buyBuilding(i){
  initAudio();
  const b = BUILDINGS[i];
  const owned = state.owned[i];
  let n;
  if (buyAmount==='max'){
    n = maxAffordable(b.base, owned, state.coins);
    if (n<=0) return;
  } else n = buyAmount;
  const cost = costOf(b.base, owned, n);
  if (state.coins < cost) return;
  state.coins -= cost;
  state.owned[i] += n;
  sfx.buy();
  toast(`${b.name} ×${n} куплено!`);
  updateUI(); updateShop(); checkAchievements();
}
function updateShop(){
  if (currentTab!=='buildings') return;
  for (let i=0;i<BUILDINGS.length;i++){
    const b = BUILDINGS[i], ref = shopRefs.items[i];
    if (!ref) continue;
    const n = currentBuyCount(b.base, state.owned[i]);
    const cost = costOf(b.base, state.owned[i], n);
    ref.owned.textContent = state.owned[i];
    ref.cost.textContent = '💰 ' + fmt(cost);
    ref.el.classList.toggle('disabled', state.coins < cost);
  }
}

/* УЛУЧШЕНИЯ */
function renderUpgrades(){
  let html = '<div class="section-title">Сила клика</div><div id="clickUpgList"></div>';
  html += '<div class="section-title">Улучшения зданий</div><div id="buildUpgList"></div>';
  el.tabContent.innerHTML = html;

  const clickList = $('clickUpgList');
  CLICK_UPGRADES.forEach(u=>{
    const lvl = state.clickLevels[u.id]||0;
    const unlocked = clickUpgradeUnlocked(u);
    if (!unlocked && lvl===0) return; // hide completely locked
    const div = document.createElement('div');
    div.className='upgrade-item';
    div.dataset.uid=u.id;
    const cost = clickUpgradeCost(u);
    div.innerHTML = `
      <div class="upgrade-icon">${u.icon}</div>
      <div class="upgrade-body">
        <div class="upgrade-name">${u.name} <span style="color:#7fb2ff;font-weight:600">ур. ${lvl}</span></div>
        <div class="upgrade-desc">${u.desc}</div>
      </div>
      <div class="upgrade-cost">💰 ${fmt(cost)}</div>`;
    div.onclick = ()=>buyClickUpgrade(u.id);
    clickList.appendChild(div);
  });
  if (!clickList.children.length){
    clickList.innerHTML = '<div style="font-size:11.5px;color:#8b95c9;padding:8px;text-align:center">Откроется при прогрессе</div>';
  }

  const buildList = $('buildUpgList');
  let anyBuildUpg = false;
  BUILDING_UPGRADES.forEach(u=>{
    if (state.buildingUpgrades[u.id]) return; // already bought
    if (state.owned[u.bIdx] < u.threshold) return; // not unlocked
    anyBuildUpg = true;
    const div = document.createElement('div');
    div.className='upgrade-item';
    div.dataset.buid=u.id;
    div.innerHTML = `
      <div class="upgrade-icon">${u.icon}</div>
      <div class="upgrade-body">
        <div class="upgrade-name">${u.name}</div>
        <div class="upgrade-desc">${u.desc}</div>
      </div>
      <div class="upgrade-cost">💰 ${fmt(u.cost)}</div>`;
    div.onclick = ()=>buyBuildingUpgrade(u.id);
    buildList.appendChild(div);
  });
  if (!anyBuildUpg){
    buildList.innerHTML = '<div style="font-size:11.5px;color:#8b95c9;padding:8px;text-align:center">Купи больше зданий, чтобы открыть улучшения</div>';
  }
  updateUpgrades();
}
function updateUpgrades(){
  if (currentTab!=='upgrades') return;
  document.querySelectorAll('#clickUpgList .upgrade-item').forEach(div=>{
    const u = CLICK_UPGRADES.find(x=>x.id===div.dataset.uid);
    if (!u) return;
    const cost = clickUpgradeCost(u);
    div.classList.toggle('disabled', state.coins < cost);
  });
  document.querySelectorAll('#buildUpgList .upgrade-item').forEach(div=>{
    const u = BUILDING_UPGRADES.find(x=>x.id===div.dataset.buid);
    if (!u) return;
    div.classList.toggle('disabled', state.coins < u.cost);
  });
}
function buyClickUpgrade(id){
  initAudio();
  const u = CLICK_UPGRADES.find(x=>x.id===id);
  if (!u || !clickUpgradeUnlocked(u)) return;
  const cost = clickUpgradeCost(u);
  if (state.coins < cost) return;
  state.coins -= cost;
  state.clickLevels[id] = (state.clickLevels[id]||0) + 1;
  sfx.buy();
  updateUI(); renderUpgrades(); checkAchievements();
}
function buyBuildingUpgrade(id){
  initAudio();
  const u = BUILDING_UPGRADES.find(x=>x.id===id);
  if (!u || state.buildingUpgrades[id]) return;
  if (state.owned[u.bIdx] < u.threshold) return;
  if (state.coins < u.cost) return;
  state.coins -= u.cost;
  state.buildingUpgrades[id] = true;
  sfx.buy();
  toast(`⚡ ${u.name} активировано!`);
  updateUI(); renderUpgrades(); checkAchievements();
}

/* ПРЕСТИЖ */
function renderPrestige(){
  const pg = getPrestigeGain(), rg = getRebirthGain(), ag = getAscensionGain();
  el.tabContent.innerHTML = `
    <div class="prestige-card">
      <div class="pc-header"><div class="pc-icon">⭐</div><div class="pc-title">Престиж</div></div>
      <div class="pc-desc">Сбрось монеты и здания и получи <b>звёзды</b>. Каждая звезда даёт <b>+25%</b> ко всему доходу. Требует 1M заработанных монет за цикл.</div>
      <div class="pc-stats">
        <div class="pc-stat"><span class="pc-stat-label">Звёзд</span><span class="pc-stat-val">${state.stars}</span></div>
        <div class="pc-stat"><span class="pc-stat-label">Престижей</span><span class="pc-stat-val">${state.prestiges}</span></div>
        <div class="pc-stat"><span class="pc-stat-label">Дадут</span><span class="pc-stat-val">+${pg}⭐</span></div>
      </div>
      <button class="pc-btn star" id="pcPrestigeBtn" ${pg<=0?'disabled':''}>
        ${pg>0?`Престиж (+${pg}⭐)`:'Нужно 1M заработать'}
      </button>
      <div class="pc-warn">Формула: <b>√(всего/1M)</b> · Сейчас всего за цикл: <b>${fmt(state.totalCoins)}</b></div>
    </div>

    <div class="prestige-card rebirth">
      <div class="pc-header"><div class="pc-icon">👻</div><div class="pc-title">Перерождение</div></div>
      <div class="pc-desc">Сбрось звёзды и получи <b>души</b>. Каждая душа даёт <b>+200%</b> ко всему доходу и никогда не сбрасывается. Требует 10+ звёзд.</div>
      <div class="pc-stats">
        <div class="pc-stat"><span class="pc-stat-label">Душ</span><span class="pc-stat-val">${state.souls}</span></div>
        <div class="pc-stat"><span class="pc-stat-label">Перерождений</span><span class="pc-stat-val">${state.rebirths}</span></div>
        <div class="pc-stat"><span class="pc-stat-label">Дадут</span><span class="pc-stat-val">+${rg}👻</span></div>
      </div>
      <button class="pc-btn rebirth" id="pcRebirthBtn" ${rg<=0?'disabled':''}>
        ${rg>0?`Переродиться (+${rg}👻)`:`Нужно 10+ ⭐ (сейчас ${state.stars})`}
      </button>
      <div class="pc-warn">Формула: <b>floor(звёзды/5)</b> · Будет сброшено: монеты, здания, звёзды</div>
    </div>

    <div class="prestige-card ascend">
      <div class="pc-header"><div class="pc-icon">🌟</div><div class="pc-title">Вознесение</div></div>
      <div class="pc-desc">Сбрось души и получи <b>эссенцию</b>. Каждая эссенция умножает <b>весь доход на ×1.5</b>. Требует 10+ душ.</div>
      <div class="pc-stats">
        <div class="pc-stat"><span class="pc-stat-label">Эссенций</span><span class="pc-stat-val">${state.essence}</span></div>
        <div class="pc-stat"><span class="pc-stat-label">Вознесений</span><span class="pc-stat-val">${state.ascensions}</span></div>
        <div class="pc-stat"><span class="pc-stat-label">Дадут</span><span class="pc-stat-val">+${ag}🌟</span></div>
      </div>
      <button class="pc-btn ascend" id="pcAscendBtn" ${ag<=0?'disabled':''}>
        ${ag>0?`Вознестись (+${ag}🌟)`:`Нужно 10+ 👻 (сейчас ${state.souls})`}
      </button>
      <div class="pc-warn">Формула: <b>floor(души/10)</b> · Будет сброшено: монеты, здания, звёзды, души</div>
    </div>
  `;
  $('pcPrestigeBtn').onclick = doPrestige;
  $('pcRebirthBtn').onclick = doRebirth;
  $('pcAscendBtn').onclick = doAscension;
}

/* ДОСТИЖЕНИЯ */
function renderAchievements(){
  const unlocked = getAchievementCount();
  let html = `<div class="ach-counter">Открыто: <b>${unlocked}</b> / ${ACHIEVEMENTS.length} · Бонус: <b>+${unlocked*2}%</b> ко всему</div>`;
  html += '<div class="ach-grid">';
  ACHIEVEMENTS.forEach(a=>{
    const has = !!state.achievements[a.id];
    html += `<div class="ach ${has?'unlocked':''}">
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-name">${a.name}</div>
      <div class="ach-desc">${a.desc}</div>
    </div>`;
  });
  html += '</div>';
  el.tabContent.innerHTML = html;
}

/* ЕЩЁ (статистика + настройки) */
function renderMore(){
  el.tabContent.innerHTML = `
    <div class="section-title">Статистика</div>
    <div class="stats-grid">
      <div class="stats-item"><span class="stats-label">Кликов сделано</span><span class="stats-value">${fmt(state.totalClicks)}</span></div>
      <div class="stats-item"><span class="stats-label">Монет всего</span><span class="stats-value">${fmt(state.lifetimeCoins)}</span></div>
      <div class="stats-item"><span class="stats-label">Время в игре</span><span class="stats-value">${fmtTime(state.playTime)}</span></div>
      <div class="stats-item"><span class="stats-label">Зданий</span><span class="stats-value">${state.owned.reduce((a,b)=>a+b,0)}</span></div>
      <div class="stats-item"><span class="stats-label">Макс. стрик</span><span class="stats-value">${state.maxStreak}</span></div>
      <div class="stats-item"><span class="stats-label">Печенек поймано</span><span class="stats-value">${state.goldenCaught}</span></div>
      <div class="stats-item"><span class="stats-label">Достижений</span><span class="stats-value">${getAchievementCount()}/${ACHIEVEMENTS.length}</span></div>
      <div class="stats-item"><span class="stats-label">Множитель</span><span class="stats-value" style="color:#ffc83d">×${fmt(getGlobalMult())}</span></div>
    </div>

    <div class="section-title">Настройки</div>
    <div class="setting-row">
      <span class="setting-label">🔊 Звуки</span>
      <div class="toggle ${state.settings.sound?'on':''}" id="toggleSound"></div>
    </div>
    <div class="setting-row">
      <span class="setting-label">✨ Частицы</span>
      <div class="toggle ${state.settings.particles?'on':''}" id="toggleParticles"></div>
    </div>

    <div class="section-title">Управление</div>
    <button class="btn small danger" id="resetBtn" style="width:100%;padding:11px">🗑️ Сбросить весь прогресс</button>
  `;
  $('toggleSound').onclick = ()=>{
    state.settings.sound = !state.settings.sound;
    $('toggleSound').classList.toggle('on', state.settings.sound);
    if (state.settings.sound) initAudio();
  };
  $('toggleParticles').onclick = ()=>{
    state.settings.particles = !state.settings.particles;
    $('toggleParticles').classList.toggle('on', state.settings.particles);
  };
  $('resetBtn').onclick = ()=>{
    if (!confirm('Удалить ВЕСЬ прогресс, включая души, эссенции и достижения? Это необратимо.')) return;
    if (!confirm('Точно уверен? Второе подтверждение.')) return;
    localStorage.removeItem(SAVE_KEY);
    state = defaultState();
    renderTab(); updateUI();
    toast('Прогресс полностью сброшен', 'red');
  };
}

function checkAchievements(){
  let changed = false;
  for (const a of ACHIEVEMENTS){
    if (!state.achievements[a.id] && a.check(state)){
      state.achievements[a.id] = true;
      changed = true;
      toast('🏆 ' + a.name, 'blue');
      sfx.ach();
    }
  }
  if (changed){
    if (currentTab==='achievements') renderAchievements();
    updateUI();
  }
}

/* ============================================================
   ПРЕСТИЖ / ПЕРЕРОЖДЕНИЕ / ВОЗНЕСЕНИЕ
   ============================================================ */
function resetRun(keepStars=true){
  state.coins = 0;
  state.totalCoins = 0;
  state.clickLevels = {ck1:0,ck2:0,ck3:0,ck4:0};
  state.owned = BUILDINGS.map(()=>0);
  state.buildingUpgrades = {};
  state.buffs = [];
  state.streak = 0;
  if (!keepStars) state.stars = 0;
}

function doPrestige(){
  initAudio();
  const gain = getPrestigeGain();
  if (gain<=0) return;
  if (!confirm(`Сбросить монеты и здания?\n\nПолучишь: +${gain} ⭐ звёзд\nМножитель станет: ×${fmt(1+(state.stars+gain)*0.25+state.souls*2)}+`)) return;
  state.stars += gain;
  state.prestiges++;
  resetRun(true);
  sfx.prestige();
  toast(`⭐ Престиж! +${gain} звёзд`, 'purple');
  renderTab(); updateUI(); checkAchievements(); saveGame();
}

function doRebirth(){
  initAudio();
  const gain = getRebirthGain();
  if (gain<=0) return;
  if (!confirm(`Переродиться и получить +${gain} 👻 душ?\n\nБудет сброшено:\n• Монеты, здания\n• Звёзды (${state.stars})\n\nОстанется:\n• Души (${state.souls} → ${state.souls+gain})\n• Достижения, эссенции`)) return;
  state.souls += gain;
  state.rebirths++;
  resetRun(false);
  sfx.rebirth();
  toast(`👻 Перерождение! +${gain} душ`, 'purple');
  renderTab(); updateUI(); checkAchievements(); saveGame();
}

function doAscension(){
  initAudio();
  const gain = getAscensionGain();
  if (gain<=0) return;
  if (!confirm(`Вознестись и получить +${gain} 🌟 эссенций?\n\nБудет сброшено:\n• Монеты, здания, звёзды\n• Души (${state.souls})\n\nОстанется:\n• Эссенции (${state.essence} → ${state.essence+gain})\n• Достижения\n• Множитель ×1.5 за каждую`)) return;
  state.essence += gain;
  state.ascensions++;
  state.souls = 0;
  resetRun(false);
  sfx.ascend();
  toast(`🌟 Вознесение! +${gain} эссенций`, 'cyan');
  renderTab(); updateUI(); checkAchievements(); saveGame();
}

el.prestigeBtn.onclick = doPrestige;
el.rebirthBtn.onclick = doRebirth;
el.ascendBtn.onclick = doAscension;

/* ============================================================
   ОБНОВЛЕНИЕ UI
   ============================================================ */
function updateUI(){
  el.coins.textContent = fmt(state.coins);
  el.cps.textContent = fmt(getCPS());
  el.cpc.textContent = fmt(getClickPower());
  el.stars.textContent = state.stars;
  el.souls.textContent = state.souls;
  el.essence.textContent = state.essence;
  el.mult.textContent = '×' + fmt(getGlobalMult());
  el.lifetime.textContent = fmt(state.lifetimeCoins);
  el.golden.textContent = state.goldenCaught;

  // Кнопки престижа
  const pg = getPrestigeGain();
  el.prestigeBtn.disabled = pg<=0;
  el.prestigeBtn.textContent = pg>0?`⭐ Престиж (+${pg})`:'⭐ Престиж';

  const rg = getRebirthGain();
  el.rebirthBtn.disabled = rg<=0;
  el.rebirthBtn.textContent = rg>0?`👻 Перерождение (+${rg})`:'👻 Перерождение';

  const ag = getAscensionGain();
  el.ascendBtn.disabled = ag<=0;
  el.ascendBtn.textContent = ag>0?`🌟 Вознесение (+${ag})`:'🌟 Вознесение';
}

/* ============================================================
   ВКЛАДКИ
   ============================================================ */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    renderTab();
  });
});

/* ============================================================
   СОХРАНЕНИЕ
   ============================================================ */
function saveGame(){
  try {
    state.lastSave = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    if (el.footerNote) el.footerNote.textContent = 'Сохранено в ' + new Date().toLocaleTimeString();
  } catch(e){}
}
function loadGame(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    const fresh = defaultState();
    state = Object.assign(fresh, data);
    // миграция со старого формата
    if (typeof state.clickLevel === 'number'){
      state.clickLevels = {ck1: state.clickLevel, ck2:0, ck3:0, ck4:0};
      delete state.clickLevel;
    }
    if (!state.clickLevels) state.clickLevels = {ck1:0,ck2:0,ck3:0,ck4:0};
    if (!Array.isArray(state.owned) || state.owned.length !== BUILDINGS.length){
      state.owned = BUILDINGS.map((_,i)=> (state.owned && state.owned[i]) || 0);
    }
    if (!state.buildingUpgrades) state.buildingUpgrades = {};
    if (!Array.isArray(state.buffs)) state.buffs = [];
    if (!state.settings) state.settings = {sound:true, particles:true};
    if (typeof state.essence !== 'number') state.essence = 0;
    if (typeof state.ascensions !== 'number') state.ascensions = 0;
    if (typeof state.goldenCaught !== 'number') state.goldenCaught = 0;
    if (typeof state.maxStreak !== 'number') state.maxStreak = 0;
    // очистить просроченные бафы
    state.buffs = state.buffs.filter(b => b.until > Date.now());
    // офлайн-доход
    const elapsed = Math.min((Date.now() - (state.lastSave||Date.now()))/1000, 8*3600);
    if (elapsed > 10){
      const offline = getCPS() * elapsed * 0.5;
      if (offline > 0){
        state.coins += offline; state.totalCoins += offline; state.lifetimeCoins += offline;
        setTimeout(()=>toast(`💤 Офлайн: +${fmt(offline)} монет`, 'blue'), 600);
      }
    }
    return true;
  } catch(e){ return false; }
}
window.addEventListener('beforeunload', saveGame);
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) saveGame(); });

/* ============================================================
   ИГРОВОЙ ЦИКЛ
   ============================================================ */
let lastFrame = performance.now();
let uiTimer = 0, achTimer = 0, saveTimer = 0, buffTimer = 0, goldenTimer = 0;

function gameLoop(now){
  const dt = Math.min((now - lastFrame)/1000, 1);
  lastFrame = now;
  state.playTime += dt;

  // пассивный доход
  const gain = getCPS() * dt;
  if (gain > 0){
    state.coins += gain; state.totalCoins += gain; state.lifetimeCoins += gain;
  }

  // обновление UI
  uiTimer += dt;
  if (uiTimer >= 0.06){
    uiTimer = 0;
    updateUI();
    if (currentTab==='buildings') updateShop();
    else if (currentTab==='upgrades') updateUpgrades();
    // стрик затухает
    if (Date.now()-state.lastClickTime > 1500 && state.streak > 0){
      state.streak = 0;
      updateStreakIndicator();
    }
  }

  // достижения
  achTimer += dt;
  if (achTimer >= 0.5){ achTimer = 0; checkAchievements(); }

  // баффы
  buffTimer += dt;
  if (buffTimer >= 1){ buffTimer = 0; cleanBuffs(); renderBuffs(); }

  // золотая печенька (случайно каждые 45-120 сек)
  goldenTimer += dt;
  if (!goldenCookie && goldenTimer >= 45 + Math.random()*75){
    goldenTimer = 0;
    spawnGoldenCookie();
  }

  // автосейв
  saveTimer += dt;
  if (saveTimer >= 15){ saveTimer = 0; saveGame(); }

  requestAnimationFrame(gameLoop);
}

/* ============================================================
   СТАРТ
   ============================================================ */
loadGame();
renderTab();
updateUI();
renderBuffs();
requestAnimationFrame(gameLoop);
</script>
</body>
